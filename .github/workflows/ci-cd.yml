name: UniSport CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js (for frontend)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    # 1. Backend build & test
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Run Backend Tests
      # ByteBuddy warninglarni o'tkazib yuborish va testlarni ishga tushirish
      run: mvn clean test -Dnet.bytebuddy.experimental=true

    # 2. Frontend build & test
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    # 3. Docker build test
    - name: Build Backend Docker Image
      run: docker build -t unisport-backend:latest .
      
    - name: Build Frontend Docker Image
      working-directory: ./frontend
      run: docker build -t unisport-frontend:latest .
