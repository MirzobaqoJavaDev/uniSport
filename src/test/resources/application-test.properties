spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=TestSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm123!
jwt.expiration=3600000

minio.url=http://localhost:9000
minio.access-key=test_key
minio.secret-key=test_secret
minio.bucket-name=test-bucket

ai.provider=OPENAI
ai.openai.api-key=test-key
ai.gemini.api-key=test-key
management.health.redis.enabled=false
