databaseChangeLog:
  - changeSet:
      id: 02-create-core-tables
      author: system
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }

        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column: { name: password_hash, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: first_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: last_name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: role_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_users_role, references: roles(id) } }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }

        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column: { name: user_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_tokens_user, references: users(id) } }
              - column: { name: token, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: expires_at, type: TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: facilities
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: description, type: TEXT }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              
        - createTable:
            tableName: courts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column: { name: facility_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_courts_facility, references: facilities(id) } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }

        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column: { name: user_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_bookings_user, references: users(id) } }
              - column: { name: court_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_bookings_court, references: courts(id) } }
              - column: { name: start_time, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: end_time, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: version, type: INTEGER, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: created_by, type: UUID }
              - column: { name: updated_by, type: UUID }
