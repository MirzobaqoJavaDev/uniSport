databaseChangeLog:
  - changeSet:
      id: 09-create-notifications
      author: system
      changes:
        - createTable:
            tableName: notifications
            columns:

              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true } }
              - column: { name: recipient_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_notifications_user, references: users(id) } }
              - column: { name: type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: reference_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: channel, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: error_message, type: VARCHAR(1000) }
              - column: { name: version, type: INTEGER, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
        - addUniqueConstraint:
            tableName: notifications
            columnNames: reference_id, type
            constraintName: uc_notifications_ref_type
