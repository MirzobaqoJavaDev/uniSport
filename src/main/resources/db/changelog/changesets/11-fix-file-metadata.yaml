databaseChangeLog:
  - changeSet:
      id: 11-drop-old-files-schema-table
      author: antigravity
      changes:
        - dropTable:
            schemaName: files
            tableName: file_metadata

  - changeSet:
      id: 11-create-file-metadata-table
      author: antigravity
      changes:
        - createTable:
            tableName: file_metadata
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true } }
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column: { name: original_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: storage_path, type: VARCHAR(500), constraints: { nullable: false, unique: true } }
              - column: { name: content_type, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: size, type: BIGINT, constraints: { nullable: false } }
              - column: { name: uploaded_by, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_filemeta_user, references: users(id) } }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP, defaultValueComputed: CURRENT_TIMESTAMP }
