databaseChangeLog:
  - changeSet:
      id: add-inventory-items-table
      author: antigravity
      changes:
        - createTable:
            tableName: inventory_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: facility_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_inventory_items_facility
                    references: facilities(id)
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: total_quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: available_quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-dynamic-qr-codes-table
      author: antigravity
      changes:
        - createTable:
            tableName: dynamic_qr_codes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_dynamic_qr_codes_user
                    references: users(id)
              - column:
                  name: qr_data
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: is_used
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-exercises-table
      author: antigravity
      changes:
        - createTable:
            tableName: exercises
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: target_muscle_group
                  type: VARCHAR(100)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: video_url
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-workout-plans-table
      author: antigravity
      changes:
        - createTable:
            tableName: workout_plans
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_plans_user
                    references: users(id)
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: difficulty_level
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-workout-plan-exercises-table
      author: antigravity
      changes:
        - createTable:
            tableName: workout_plan_exercises
            columns:
              - column:
                  name: workout_plan_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_wpe_workout_plan
                    references: workout_plans(id)
              - column:
                  name: exercise_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_wpe_exercise
                    references: exercises(id)

  - changeSet:
      id: add-token-usage-logs-table
      author: antigravity
      changes:
        - createTable:
            tableName: token_usage_logs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_token_usage_logs_user
                    references: users(id)
              - column:
                  name: request_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: tokens_used
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
